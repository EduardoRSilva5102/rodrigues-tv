apiVersion: apps/v1
kind: Deployment
metadata:
  name: rodrigues-tv-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rodrigues-tv
  template:
    metadata:
      labels:
        app: rodrigues-tv
    spec:
      containers:
        - name: web-container
          image: rodriguestv:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rodrigues-tv-service
spec:
  type: NodePort
  selector:
    app: rodrigues-tv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090